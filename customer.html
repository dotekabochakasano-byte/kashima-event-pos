<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>鹿島ハイツ 鹿島神宮駅前店 顧客表示</title>
  <link rel="stylesheet" href="customer.css?v=25" />
</head>
<body>
  <main class="customer-shell">
    <section id="standbyView" class="customer-view active">
      <video id="adVideo" class="ad-video" muted playsinline webkit-playsinline autoplay loop preload="auto" hidden></video>
      <div id="standbyFallback" class="standby-fallback">
        <div class="standby-mark">KASHIMA HEIGHTS</div>
        <h1><span class="standby-title-small">鹿島ハイツ</span><span class="standby-title-main">鹿島神宮駅前店</span></h1>
        <p>ご注文をお待ちしています</p>
      </div>
    </section>

    <section id="orderView" class="customer-view order-view">
      <div class="customer-headline">ご注文内容</div>
      <div class="order-main-layout">
        <div class="order-list-pane">
          <div id="customerItems" class="customer-items"></div>
        </div>
        <aside class="order-side-pane">
          <div class="customer-total-row"><span>合計</span><strong id="customerTotal">¥0</strong></div>
          <div class="customer-payment-row">お支払い：<strong id="customerPayment">現金</strong></div>
          <div id="customerCashInfo" class="customer-cash-info" hidden>
            <div class="customer-cash-box"><span>お預かり</span><strong id="customerTendered">¥0</strong></div>
            <div class="customer-cash-box"><span>お釣り</span><strong id="customerChange">¥0</strong></div>
          </div>
          <div id="customerQrInfo" class="customer-qr-info" hidden>
            <div class="customer-qr-header">QRコード決済</div>
            <div class="customer-qr-method" id="customerQrMethod">PayPay / 楽天ペイ / d払い / au PAY</div>
            <img class="customer-qr-logo-strip" src="./assets/payment-logos.png" alt="対応QR決済ブランド" />
            <div class="customer-qr-card">
              <img id="customerQrImage" class="customer-qr-image" src="./assets/payment-qr.png" alt="決済用QRコード" />
            </div>
            <div class="customer-qr-note">
              <p>こちらのQRコードを、スマートフォンの決済画面からカメラで読み取ってください。</p>
              <p>決済完了まで、画面を閉じずにお待ちください。</p>
            </div>
          </div>
        </aside>
      </div>
    </section>

    <section id="completeView" class="customer-view complete-view">
      <div class="complete-check">✓</div>
      <div class="complete-title">お会計ありがとうございました</div>
      <div class="complete-order-label">受付番号</div>
      <div id="completeOrderNo" class="complete-order-no">---</div>
      <div id="completePayment" class="complete-payment"></div>
      <div id="completeChange" class="complete-change"></div>
      <div class="complete-note">商品受け渡しまでお待ちください</div>
    </section>

    <div id="connectionBadge" class="connection-badge">顧客表示</div>
  </main>
  <script src="customer.js?v=25"></script>
</body>
</html>
